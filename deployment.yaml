apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcr-flux-lab-demo
  template:
    metadata:
      labels:
        app: mcr-flux-lab-demo
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=Hello from restricted Flux"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
